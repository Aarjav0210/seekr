[package]
name = "seekr"
version = "1.3.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
ratatui = "0.30.2"
seekr-core = { version = "0.1.0", path = "../seekr-core" }
serde_json = "1.0.151"
unicode-width = "0.2"

# seekr.app: its own launcher window and hotkey (see src/gui).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-text = "0.3.2"
