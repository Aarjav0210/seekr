# kitty configuration for the seekr launcher window.
# Installed to ~/.config/seekr/kitty.conf by contrib/install-launcher.sh
# (re-running the script overwrites it). Hammerspoon opens the window with
# `kitten panel --config <this> ... <seekr> --resident`, so nothing here names
# the binary, and kitty runs it directly: no login shell, no ~/.zshrc.
# It is a panel rather than a regular kitty window because a panel is on every
# desktop (Space) at once: the launcher comes back wherever you are.

# Just the terminal: no title bar, no traffic lights.
hide_window_decorations yes
window_padding_width 6 10
# Translucent grey, like Spotlight: a dark grey base the desktop shows through,
# blurred. The base is grey rather than black because translucent black over a
# dark app is just black. The installer's --opacity sets the opacity line
# (1.0 is solid) and keeps it across re-runs. The blur radius only applies
# while the opacity is below 1.
# kitty makes only the default background see-through. seekr paints its own
# backing colour behind text (crates/seekr/src/tui/view.rs, BACKING) and the
# selected row in another; both are listed here with their own opacity, so the
# text stays readable over a white window while the empty parts of the
# launcher show the desktop through. The installer keeps this opacity at
# least the window's.
background #35353a
background_opacity 0.8
background_blur 40
transparent_background_colors #36363b@0.85 #464a56@0.85
# Panels default to a level below regular windows (they are meant as desktop
# widgets). Put this one at the regular level, so it behaves like any window:
# in front while it has focus, behind whatever you click next. Its size and
# position are set by Hammerspoon (contrib/hammerspoon/seekr.lua).
macos_ns_window_layer NSNormalWindowLevel

# seekr owns the screen; nothing to scroll back to.
scrollback_lines 0
mouse_hide_wait 1.0
enable_audio_bell no

# The window belongs to seekr alone: closing it ends the process, and vice versa.
macos_quit_when_last_window_closed yes
# Keep this kitty out of Cmd+Tab and the Dock: the launcher hotkey is its only
# entry point, and without this one use leaves it as the next Cmd+Tab target. (The
# panel already runs under kitty's background-only bundle; this is belt and braces.)
macos_hide_from_tasks yes
confirm_os_window_close 0
macos_option_as_alt yes
# Text-field keys for the query: ⌘← / ⌘→ jump to its start / end (sent as
# super+arrow, which seekr reads), ⌘⌫ deletes back to the start (^u).
# ⌥← / ⌥→ move by word as is, since option is alt.
map cmd+left send_text all \x1b[1;9D
map cmd+right send_text all \x1b[1;9C
map cmd+backspace send_text all \x15
shell_integration disabled
allow_remote_control no
term xterm-256color

font_size 13.0
# Uncomment to use a Nerd Font for the kind icons, e.g.:
# font_family JetBrainsMono Nerd Font
